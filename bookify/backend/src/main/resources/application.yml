server:
  port: 8080

spring:
  application:
    name: bookify
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bookify}
    username: ${DB_USER:bookify}
    password: ${DB_PASSWORD:bookify}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}

bookify:
  seed: ${SEED_DATA:true}
  jwt:
    # >= 32 characters. Override with JWT_SECRET in any real deployment.
    secret: ${JWT_SECRET:dev-only-secret-please-change-dev-only-secret}
    access-minutes: 15
    refresh-days: 7
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: noreply@bookify.dev
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
