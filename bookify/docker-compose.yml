# One command to run everything:  docker compose up --build
#   App ........ http://localhost:4200
#   API docs ... http://localhost:8080/swagger-ui.html
#   Mail inbox . http://localhost:8025   (MailHog catches every email the app sends)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bookify
      POSTGRES_USER: bookify
      POSTGRES_PASSWORD: bookify
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookify -d bookify"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailhog:
    image: mailhog/mailhog
    ports: ["1025:1025", "8025:8025"]

  backend:
    build: ./backend
    depends_on:
      db: { condition: service_healthy }
    environment:
      DB_URL: jdbc:postgresql://db:5432/bookify
      DB_USER: bookify
      DB_PASSWORD: bookify
      MAIL_HOST: mailhog
      MAIL_PORT: "1025"
      MAIL_ENABLED: "true"
      SEED_DATA: "true"
      JWT_SECRET: ${JWT_SECRET:-change-me-change-me-change-me-change-me-0123}
      CORS_ORIGINS: http://localhost:4200
    ports: ["8080:8080"]

  frontend:
    build: ./frontend
    depends_on: [backend]
    ports: ["4200:80"]

volumes:
  pgdata:
